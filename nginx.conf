server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Router sisi klien: setiap path yang tidak berupa berkas harus dilayani
    # index.html, kalau tidak me-refresh halaman /connectivity/devices akan
    # menghasilkan 404 dari nginx sebelum React Router sempat menanganinya.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Berkas dengan hash di namanya aman di-cache selamanya; index.html tidak
    # boleh, karena di situlah rujukan ke bundel versi baru berada.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
